<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Human Logo Booth</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 30px;
    }

    h1 {
      margin: 0 0 10px 0;
      font-size: 38px;
      text-align: center;
    }

    p {
      margin: 0 0 25px 0;
      font-size: 20px;
      opacity: 0.8;
      text-align: center;
    }

    .camera-box {
      position: relative;
      width: min(75vw, 700px);
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 24px;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .face-guide {
      position: absolute;
      width: 42%;
      aspect-ratio: 1 / 1;
      border: 4px solid rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-sizing: border-box;
    }

    .button {
      margin-top: 25px;
      padding: 18px 42px;
      font-size: 24px;
      font-weight: bold;
      border: 0;
      border-radius: 50px;
      cursor: pointer;
      background: white;
      color: #111;
    }

    #status {
      margin-top: 18px;
      min-height: 24px;
      font-size: 16px;
      opacity: 0.85;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>HUMAN LOGO BOOTH</h1>

    <p>Posiziona il volto all'interno della guida</p>

    <div class="camera-box">
      <video
        id="video"
        autoplay
        playsinline
        muted
      ></video>

      <div class="face-guide"></div>
    </div>

    <button
      id="startButton"
      class="button"
      onclick="startCamera()"
    >
      ATTIVA FOTOCAMERA
    </button>

    <div id="status"></div>

  </div>

  <script>
    const video = document.getElementById('video');
    const startButton = document.getElementById('startButton');
    const statusBox = document.getElementById('status');

    async function startCamera() {
      statusBox.textContent = 'Attivazione fotocamera...';

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'user'
          },
          audio: false
        });

        video.srcObject = stream;
        startButton.style.display = 'none';
        statusBox.textContent = '';

      } catch (error) {
        console.error(error);

        statusBox.textContent =
          'Errore: ' +
          error.name +
          ' - ' +
          error.message;
      }
    }
  </script>

</body>
</html>
