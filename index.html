<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Human Logo Booth</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:Arial,sans-serif;background:#070a0f;color:#fff}body{min-height:100vh}.app{width:100%;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px}.header{text-align:center;margin-bottom:20px}h1{margin:0 0 8px;font-size:clamp(28px,4vw,44px)}#instruction{margin:0;color:#aeb9c8;font-size:18px}.camera-box{position:relative;width:min(78vw,720px);aspect-ratio:4/3;background:#000;border:1px solid rgba(255,255,255,.1);border-radius:26px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.35)}video,.preview-image{width:100%;height:100%;object-fit:cover}video{transform:scaleX(-1)}.preview-image{display:none}.face-guide{position:absolute;width:40%;aspect-ratio:1/1;border:4px solid rgba(255,255,255,.85);border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}.buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:22px}.button{padding:17px 32px;border:0;border-radius:50px;background:#0da8ff;color:white;font-size:19px;font-weight:800;cursor:pointer;text-decoration:none;text-align:center}.button.secondary{background:#202733}.button.white{background:white;color:#111}.button:disabled{opacity:.45}#shootButton,#sendButton,#retakeButton{display:none}#status{margin-top:14px;min-height:22px;color:#aeb9c8;text-align:center}.result-panel{display:none;width:min(92vw,720px);margin-top:18px;text-align:center}.result-panel .button{min-width:230px}.upload-mode{display:none;width:min(94vw,720px)}.choice-card{border:1px solid rgba(255,255,255,.09);border-radius:24px;background:#111722;padding:24px;text-align:center}.choice-actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.guest-selfie,.guest-upload{display:none;margin-top:20px}.guest-upload input{width:100%;padding:14px;margin:12px 0 18px;border:1px solid #313b4a;border-radius:12px;color:white;background:#0b0f16}#guestPreview{display:none}.guest-file-preview{display:none;width:min(100%,520px);aspect-ratio:1/1;object-fit:cover;border-radius:20px;margin:18px auto}#guestSendButton{display:none}@media(max-width:650px){.camera-box{width:94vw}.choice-actions{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1 id="pageTitle">HUMAN LOGO BOOTH</h1>
    <p id="instruction">Posiziona il volto all'interno della guida</p>
  </div>

  <div id="boothMode">
    <div class="camera-box">
      <video id="video" autoplay playsinline muted></video>
      <img id="previewImage" class="preview-image" alt="Anteprima foto">
      <div id="faceGuide" class="face-guide"></div>
    </div>
    <div class="buttons">
      <button id="startButton" class="button white" onclick="startCamera()">ATTIVA FOTOCAMERA</button>
      <button id="shootButton" class="button" onclick="takePhoto()">SCATTA FOTO</button>
      <button id="retakeButton" class="button secondary" onclick="retakePhoto()">RIFAI FOTO</button>
      <button id="sendButton" class="button" onclick="sendPhoto()">INVIA</button>
    </div>
  </div>

  <div id="uploadMode" class="upload-mode">
    <div id="choiceCard" class="choice-card">
      <h2>PARTECIPA AL MOSAICO</h2>
      <p>Scegli come vuoi aggiungere la tua foto.</p>
      <div class="choice-actions">
        <button class="button" onclick="openGuestSelfie()">SCATTA SELFIE</button>
        <button class="button secondary" onclick="openGuestUpload()">CARICA DAL TELEFONO</button>
      </div>
    </div>

    <div id="guestSelfie" class="guest-selfie">
      <div class="camera-box">
        <video id="guestVideo" autoplay playsinline muted></video>
        <img id="guestPreview" class="preview-image" alt="Anteprima selfie">
        <div id="guestFaceGuide" class="face-guide"></div>
      </div>
      <div class="buttons">
        <button id="guestShootButton" class="button" onclick="takeGuestSelfie()">SCATTA SELFIE</button>
        <button id="guestRetakeButton" class="button secondary" style="display:none" onclick="retakeGuestSelfie()">RIFAI SELFIE</button>
        <button id="guestSendButton" class="button" onclick="sendGuestPhoto()">INVIA AL MOSAICO</button>
        <button class="button secondary" onclick="backToChoices()">INDIETRO</button>
      </div>
    </div>

    <div id="guestUpload" class="guest-upload choice-card">
      <h2>CARICA DAL TELEFONO</h2>
      <input id="guestFile" type="file" accept="image/*">
      <img id="guestFilePreview" class="guest-file-preview" alt="Anteprima upload">
      <div class="buttons">
        <button id="guestFileSendButton" class="button" disabled onclick="sendGuestFilePhoto()">INVIA AL MOSAICO</button>
        <button class="button secondary" onclick="backToChoices()">INDIETRO</button>
      </div>
    </div>
  </div>

  <div id="status"></div>

  <div id="resultPanel" class="result-panel">
    <button class="button white" onclick="downloadCurrentPhoto()">SCARICA FOTO</button>
  </div>

  <canvas id="canvas" style="display:none"></canvas>
  <canvas id="thumbCanvas" style="display:none"></canvas>
</div>

<script>
const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbwIQ4bP6RxXol5l0D-dPlgUIHKJw5Ctr4nn_utJz1mjGsZRDIoedZnvPUwnzrk1C2EybA/exec';
const params=new URLSearchParams(location.search);const mode=params.get('mode')||'booth';
const video=document.getElementById('video'),previewImage=document.getElementById('previewImage'),faceGuide=document.getElementById('faceGuide'),startButton=document.getElementById('startButton'),shootButton=document.getElementById('shootButton'),sendButton=document.getElementById('sendButton'),retakeButton=document.getElementById('retakeButton');
const guestVideo=document.getElementById('guestVideo'),guestPreview=document.getElementById('guestPreview'),guestFaceGuide=document.getElementById('guestFaceGuide'),guestShootButton=document.getElementById('guestShootButton'),guestRetakeButton=document.getElementById('guestRetakeButton'),guestSendButton=document.getElementById('guestSendButton');
const guestFile=document.getElementById('guestFile'),guestFilePreview=document.getElementById('guestFilePreview'),guestFileSendButton=document.getElementById('guestFileSendButton');
const canvas=document.getElementById('canvas'),thumbCanvas=document.getElementById('thumbCanvas'),statusBox=document.getElementById('status'),instruction=document.getElementById('instruction'),resultPanel=document.getElementById('resultPanel');
let currentStream=null,guestStream=null,capturedImage=null,thumbnailImage=null,lastSentImage=null,sending=false;

if(mode==='upload'){document.getElementById('boothMode').style.display='none';document.getElementById('uploadMode').style.display='block';document.getElementById('pageTitle').textContent='PARTECIPA AL MOSAICO';instruction.textContent='Scatta un selfie oppure carica una foto dal telefono';}else{document.getElementById('boothMode').style.display='block';}

async function startCamera(){hideResult();statusBox.textContent='Attivazione fotocamera...';try{currentStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1920},height:{ideal:1080}},audio:false});video.srcObject=currentStream;video.style.display='block';previewImage.style.display='none';faceGuide.style.display='block';startButton.style.display='none';shootButton.style.display='inline-block';sendButton.style.display='none';retakeButton.style.display='none';instruction.textContent='Posiziona il volto all’interno della guida';statusBox.textContent='';}catch(e){showCameraError(e)}}
function stopCamera(){if(currentStream){currentStream.getTracks().forEach(t=>t.stop());currentStream=null}video.srcObject=null}
function takePhoto(){if(!video.videoWidth||!video.videoHeight){statusBox.textContent='La fotocamera non è ancora pronta.';return}const set=createSquareImagesFromVideo(video,true);capturedImage=set.full;thumbnailImage=set.thumb;previewImage.src=capturedImage;stopCamera();video.style.display='none';previewImage.style.display='block';faceGuide.style.display='none';shootButton.style.display='none';retakeButton.style.display='inline-block';sendButton.style.display='inline-block';instruction.textContent='Ti piace questa foto?';statusBox.textContent=''}
async function retakePhoto(){capturedImage=null;thumbnailImage=null;previewImage.src='';previewImage.style.display='none';sendButton.style.display='none';retakeButton.style.display='none';await startCamera()}
async function sendPhoto(){if(!capturedImage||sending)return;await sendToServer(capturedImage,thumbnailImage,'booth')}

async function openGuestSelfie(){resetGuestMedia();document.getElementById('choiceCard').style.display='none';document.getElementById('guestUpload').style.display='none';document.getElementById('guestSelfie').style.display='block';statusBox.textContent='Attivazione fotocamera...';try{guestStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1920},height:{ideal:1080}},audio:false});guestVideo.srcObject=guestStream;guestVideo.style.display='block';guestPreview.style.display='none';guestFaceGuide.style.display='block';guestShootButton.style.display='inline-block';guestRetakeButton.style.display='none';guestSendButton.style.display='none';statusBox.textContent='';}catch(e){document.getElementById('guestSelfie').style.display='none';document.getElementById('choiceCard').style.display='block';showCameraError(e)}}
function stopGuestCamera(){if(guestStream){guestStream.getTracks().forEach(t=>t.stop());guestStream=null}guestVideo.srcObject=null}
function takeGuestSelfie(){if(!guestVideo.videoWidth||!guestVideo.videoHeight){statusBox.textContent='La fotocamera non è ancora pronta.';return}const set=createSquareImagesFromVideo(guestVideo,true);capturedImage=set.full;thumbnailImage=set.thumb;guestPreview.src=capturedImage;stopGuestCamera();guestVideo.style.display='none';guestPreview.style.display='block';guestFaceGuide.style.display='none';guestShootButton.style.display='none';guestRetakeButton.style.display='inline-block';guestSendButton.style.display='inline-block';statusBox.textContent=''}
async function retakeGuestSelfie(){capturedImage=null;thumbnailImage=null;guestPreview.src='';guestPreview.style.display='none';await openGuestSelfie()}
async function sendGuestPhoto(){if(!capturedImage||sending)return;await sendToServer(capturedImage,thumbnailImage,'guest-selfie')}

function openGuestUpload(){stopGuestCamera();resetGuestMedia();document.getElementById('choiceCard').style.display='none';document.getElementById('guestSelfie').style.display='none';document.getElementById('guestUpload').style.display='block';statusBox.textContent=''}
function backToChoices(){stopGuestCamera();resetGuestMedia();document.getElementById('guestSelfie').style.display='none';document.getElementById('guestUpload').style.display='none';document.getElementById('choiceCard').style.display='block';statusBox.textContent=''}
guestFile.addEventListener('change',async function(){const file=this.files[0];if(!file)return;statusBox.textContent='Preparazione foto...';try{const set=await createSquareImagesFromFile(file);capturedImage=set.full;thumbnailImage=set.thumb;guestFilePreview.src=capturedImage;guestFilePreview.style.display='block';guestFileSendButton.disabled=false;statusBox.textContent=''}catch(e){statusBox.textContent='Errore: '+e.message}})
async function sendGuestFilePhoto(){if(!capturedImage||sending)return;await sendToServer(capturedImage,thumbnailImage,'guest-upload')}

function createSquareImagesFromVideo(src,mirror){const w=src.videoWidth,h=src.videoHeight,side=Math.min(w,h),sx=(w-side)/2,sy=(h-side)/2;drawSquareVideo(canvas,src,900,sx,sy,side,mirror);drawSquareVideo(thumbCanvas,src,320,sx,sy,side,mirror);return{full:canvas.toDataURL('image/jpeg',.90),thumb:thumbCanvas.toDataURL('image/jpeg',.78)}}
function drawSquareVideo(target,src,size,sx,sy,side,mirror){target.width=size;target.height=size;const ctx=target.getContext('2d');ctx.save();if(mirror){ctx.translate(size,0);ctx.scale(-1,1)}ctx.drawImage(src,sx,sy,side,side,0,0,size,size);ctx.restore()}
async function createSquareImagesFromFile(file){const data=await readFileAsDataUrl(file),img=await loadImage(data),side=Math.min(img.naturalWidth,img.naturalHeight),sx=(img.naturalWidth-side)/2,sy=(img.naturalHeight-side)/2;drawSquareImage(canvas,img,900,sx,sy,side);drawSquareImage(thumbCanvas,img,320,sx,sy,side);return{full:canvas.toDataURL('image/jpeg',.90),thumb:thumbCanvas.toDataURL('image/jpeg',.78)}}
function drawSquareImage(target,img,size,sx,sy,side){target.width=size;target.height=size;target.getContext('2d').drawImage(img,sx,sy,side,side,0,0,size,size)}
function readFileAsDataUrl(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=e=>resolve(e.target.result);r.onerror=reject;r.readAsDataURL(file)})}
function loadImage(src){return new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src})}

async function sendToServer(full,thumb,source){sending=true;setButtonsDisabled(true);statusBox.textContent='Invio foto...';try{const response=await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({image:full,thumbnail:thumb,source})});const text=await response.text();let result;try{result=JSON.parse(text)}catch(e){throw new Error('Risposta non valida da Apps Script.')}if(!result.success)throw new Error(result.error||'Errore durante il salvataggio.');lastSentImage=full;showResult();statusBox.textContent='Foto inviata al mosaico. ID: '+result.id;if(mode==='booth'){capturedImage=null;thumbnailImage=null;sendButton.style.display='none';retakeButton.style.display='none';startButton.style.display='inline-block';startButton.textContent='NUOVA FOTO';instruction.textContent='Foto inviata correttamente'}else{stopGuestCamera();guestShootButton.style.display='none';guestRetakeButton.style.display='none';guestSendButton.style.display='none';guestFileSendButton.disabled=true;instruction.textContent='Foto inviata correttamente'}}catch(e){console.error(e);statusBox.textContent='Errore salvataggio: '+e.message}finally{sending=false;setButtonsDisabled(false)}}
function setButtonsDisabled(v){sendButton.disabled=v;retakeButton.disabled=v;guestSendButton.disabled=v;guestRetakeButton.disabled=v;if(capturedImage)guestFileSendButton.disabled=v}
function showResult(){resultPanel.style.display='block'}
function hideResult(){resultPanel.style.display='none'}
function downloadCurrentPhoto(){if(!lastSentImage){alert('Nessuna foto disponibile.');return}const a=document.createElement('a');a.href=lastSentImage;a.download='human-logo-photo-'+Date.now()+'.jpg';document.body.appendChild(a);a.click();a.remove()}
function resetGuestMedia(){capturedImage=null;thumbnailImage=null;lastSentImage=null;hideResult();guestPreview.src='';guestPreview.style.display='none';guestFilePreview.src='';guestFilePreview.style.display='none';guestFile.value='';guestFileSendButton.disabled=true}
function showCameraError(e){console.error(e);statusBox.textContent='Errore fotocamera: '+e.name+' - '+e.message}
</script>
</body>
</html>
